<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Input Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Ensure the chat area takes up most of the screen */
    .chat-container {
      height: 100vh;
      width: 100%;
      max-width: 700px;
    }
    
    /* Custom styling for the textarea */
    #chatInput {
      resize: none; /* Disable manual resizing */
      max-height: 100px; /* Limit maximum height of the input area */
      overflow-y: auto; /* Enable scrolling when max height is reached */
      line-height: 1.5;
      /* Using !important and direction: ltr for highest possible CSS specificity */
      text-align: left !important; 
      direction: ltr !important;
      transition: opacity 0.3s;
    }

    /* Style the input container to accommodate the textarea */
    .input-bar-container {
      min-height: 50px; /* Ensure input bar has a minimum height */
      align-items: flex-end; /* Align items to the bottom when textarea grows */
    }

    /* Remove previous visual styles from the mic button */
    #micButton {
        box-shadow: none !important;
        transform: none !important;
    }

    /* Visualizer Ring Styling (Starts hidden) */
    #micVisualizer {
        opacity: 0;
        /* Center the element: set top/left to 50% and pull back by -50% of its size */
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(1);
        /* Ensure transitions are fast and smooth for real-time feel */
        transition: transform 0.05s ease-out, opacity 0.05s ease-out;
    }

    /* Spinner animation */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
        animation: spin 1.5s linear infinite;
    }
  </style>
</head>

    // --- Audio Utility Functions (PCM to WAV) ---

    function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    // Function to convert PCM audio (Int16) to WAV file format (Blob)
    function pcmToWav(pcm16, sampleRate) {
        const numChannels = 1;
        const bytesPerSample = 2; // Int16
        const blockAlign = numChannels * bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = pcm16.length * bytesPerSample;

        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        // Write WAV header (RIFF chunk)
        writeString(view, 0, 'RIFF'); // ChunkID
        view.setUint32(4, 36 + dataSize, true); // ChunkSize
        writeString(view, 8, 'WAVE'); // Format

        // Write fmt sub-chunk
        writeString(view, 12, 'fmt '); // Subchunk1ID
        view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
        view.setUint16(20, 1, true); // AudioFormat (1 for PCM)
        view.setUint16(22, numChannels, true); // NumChannels
        view.setUint32(24, sampleRate, true); // SampleRate
        view.setUint32(28, byteRate, true); // ByteRate
        view.setUint16(32, blockAlign, true); // BlockAlign
        view.setUint16(34, 16, true); // BitsPerSample (16-bit)

        // Write data sub-chunk
        writeString(view, 36, 'data'); // Subchunk2ID
        view.setUint32(40, dataSize, true); // Subchunk2Size

        // Write the actual PCM data
        let offset = 44;
        for (let i = 0; i < pcm16.length; i++) {
            view.setInt16(offset, pcm16[i], true);
            offset += 2;
        }

        return new Blob([view], { type: 'audio/wav' });
    }

    // --- Text-to-Speech (TTS) Function ---

    async function playTTS(text) {
        const ttsModel = "gemini-2.5-flash-preview-tts";
        const ttsApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${ttsModel}:generateContent?key=${apiKey}`;

        const maxRetries = 10; // Increased max retries for 429 errors
        let delay = 2000;    // Increased initial delay for 429 errors

        const ttsPayload = {
            contents: [{
                // The language is inferred from the text provided here
                parts: [{ text: `Say clearly and with a helpful tone: ${text}` }]
            }],
            generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                    voiceConfig: {
                        // Using Kore voice for a clear, firm tone.
                        prebuiltVoiceConfig: { voiceName: "Kore" }
                    }
                }
            },
            model: ttsModel
        };

        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(ttsApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });

                if (!response.ok) {
                    if (response.status === 429 && i < maxRetries - 1) {
                        // Rate limit error, wait and retry
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        continue; 
                    } 
                    // Handle 400 Bad Request (invalid text content)
                    else if (response.status === 400) {
                        console.error(`TTS API Failed (400 Bad Request): The LLM response text may be too long or contain invalid characters.`);
                        throw new Error(`TTS API failed with status: ${response.status}`);
                    }
                    // For other non-OK statuses or final 429 attempt, throw error
                    throw new Error(`TTS API failed with status: ${response.status}`);
                }

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                    // Extract sample rate from mimeType, default to 24000
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    
                    const pcmDataBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmDataBuffer);
                    
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    // Stop previous audio and clean up URL before playing new one
                    if (audioPlayer) {
                        audioPlayer.pause();
                        URL.revokeObjectURL(audioPlayer.src); 
                    }

                    audioPlayer = new Audio(audioUrl);
                    
                    // Success: Return the promise from play()
                    return audioPlayer.play().catch(e => console.error("Error playing audio:", e));
                } else {
                    console.error("TTS response did not contain valid audio data.");
                    // If the API call succeeded but data was bad, treat as final.
                    break;
                }

            } catch (error) {
                const isNetworkError = error instanceof TypeError;
                const isRateLimitError = error.message.includes("429");
                
                // Only retry if it's a transient error (Network or Rate Limit) AND we have attempts left
                if ((isNetworkError || isRateLimitError) && i < maxRetries - 1) {
                    // We skip logging during backoff to avoid console clutter.
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                    continue; 
                }
                
                // For final attempt failure or non-retryable error, re-throw.
                throw error; 
            }
        }
        // This point should only be reached if retries were exhausted or a non-recoverable error occurred
        throw new Error("Failed to generate TTS audio after multiple retries.");
    }


    // --- Audio Visualization Logic (Web Audio API) ---

    function drawAmplitude() {
        if (!analyser) return;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
        }
        const average = sum / bufferLength;

        // VISUALIZATION CALCULATIONS (Gemini Style)
        const scaleFactor = 1.0 + (average / 255) * 3.0; 
        const opacity = Math.min(0.7, 0.1 + (average / 255) * 0.6);
        
        micVisualizer.style.transform = `translate(-50%, -50%) scale(${scaleFactor})`;
        micVisualizer.style.opacity = opacity;
        
        volumeAnimationId = requestAnimationFrame(drawAmplitude);
    }

    function startVolumeDetection() {
        if (!volumeAnimationId) {
            drawAmplitude();
        }
    }

    function stopAudioVisualization() {
        cancelAnimationFrame(volumeAnimationId);
        volumeAnimationId = null;
        
        micVisualizer.style.transform = 'translate(-50%, -50%) scale(1)'; 
        micVisualizer.style.opacity = '0'; 
        
        if (micStream) {
            micStream.getTracks().forEach(track => track.stop());
            micStream = null;
        }
    }

    function setupAudioVisualization() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        if (micStream) {
            startVolumeDetection();
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                micStream = stream;
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                microphone.connect(analyser);
                
                startVolumeDetection();
            })
            .catch(err => {
                console.error("Error accessing microphone for visualization:", err);
                if (isListening) recognition.stop();
            });
    }

    // --- LLM API Integration (Generate Response) ---

    async function generateResponse(query) {
        const maxRetries = 5;
        let delay = 1000;
        let finalResponse = "Sorry, I ran into an error and couldn't process your request.";

        const payload = {
            contents: [{ parts: [{ text: query }] }],
            // Enable Google Search for grounded responses
            tools: [{ "google_search": {} }],
            // Define the AI's persona
            systemInstruction: {
                parts: [{ text: systemPrompt }]
            },
        };

        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    // Check for Authorization/Permission errors (401, 403) and stop retrying
                    if (response.status === 401 || response.status === 403) {
                         console.error("FATAL API ERROR (401/403): The Gemini API key is unauthorized or missing. Please ensure you are running this application in a supported environment.");
                         // Stop execution/retries immediately for auth failures
                         throw new Error(`Authorization/Permission Error: ${response.status}`);
                    }
                    
                    // Check for rate limit errors (429) and retry
                    if (response.status === 429 && i < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        continue;
                    }
                    throw new Error(`API response status: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    finalResponse = candidate.content.parts[0].text;
                } else {
                    console.error("Gemini response lacked expected text content.", result);
                }
                
                return finalResponse; // Success, break out of the loop

            } catch (error) {
                console.error(`Attempt ${i + 1} failed:`, error);
                // Only retry if it's NOT an Authorization error and we have attempts left
                if (!(error.message.includes("401") || error.message.includes("403")) && i < maxRetries - 1) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                    continue; 
                }
                
                // For final attempt failure or non-retryable error, re-throw.
                throw error; 
            }
        }
        return finalResponse; // Return error message if all retries fail
    }


    // --- Event Listeners and Speech Recognition (Web Speech API) ---

    chatInput.addEventListener("input", updateActionButton);

    chatInput.addEventListener("keydown", (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault(); 
        actionButton.click();
      }
      setTimeout(autoResizeTextarea, 0); 
    });


    actionButton.addEventListener("click", async () => {
      const query = chatInput.value.trim();
      
      if (query && !chatInput.disabled) {
        
        // Clear any previous audio before processing new query
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.src = '';
        }

        // 1. Add user message to chat
        addMessageToChat(query, 'user');

        // 2. Clear input and set loading state (Starting LLM thinking)
        chatInput.value = "";
        updateActionButton();
        setInputState(true, true, "CampusMate is thinking..."); 

        let aiResponse = "";

        try {
            // 3. Generate response from Gemini (LLM call)
            aiResponse = await generateResponse(query);
            
            // 4. TTS Playback conditional on voice input AND toggle state
            if (isVoiceInput && isTTSActive) {
                // Wait for audio generation and playback initiation to ensure sync
                await playTTS(aiResponse); 
                // Once TTS is ready/playing, THEN display the text.
                addMessageToChat(aiResponse, 'ai');

            } else {
                // If text input OR TTS is disabled, display immediately
                addMessageToChat(aiResponse, 'ai');
            }
            
        } catch (error) {
            console.error("Fatal error during chat process:", error);
            
            let errorMessage = "🚨 **Authentication Failed:** I can't talk to the AI. This usually means the necessary API key is missing. Try running the app in a supported environment.";
            
            // Check for TTS-related errors
            if (error.message.includes("TTS API failed with status: 400")) {
                 errorMessage = "🔊 **Speech Error (400):** I successfully received the answer, but I can't speak it. The text might be too long or contain symbols I can't process.";
                 // If TTS fails, we must manually display the text we received from the LLM (which is stored in aiResponse)
                 addMessageToChat(aiResponse || "Error retrieving response.", 'ai');
            } else if (error.message.includes("TTS API failed with status: 429")) {
                 errorMessage = "🔊 **Speech Error (429):** I was rate-limited by the speech service and could not speak the response. Please wait a few seconds and try again.";
                 addMessageToChat(aiResponse || "Error retrieving response.", 'ai');
            } else if (error.message.includes("Authorization/Permission Error")) {
                 // Keep default auth error message
            }
            
            // Display the specific error message to the user
            addMessageToChat(errorMessage, 'ai');
            
        } finally {
            // 6. Reset state
            setInputState(false, false, "CampusMate is thinking..."); 
            isVoiceInput = false; // Reset voice flag after response is processed
        }
        
      } else if (chatInput.disabled) {
          console.log("Input disabled: Waiting for AI processing.");
      } else {
        console.log("Voice Chat Icon Clicked (no text).");
      }
    });

    if ("webkitSpeechRecognition" in window) {
      recognition = new webkitSpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      
      recognition.onstart = function() {
          isListening = true;
          isVoiceInput = true; // Set flag on voice start
          micButton.classList.remove('bg-gray-700');
          micButton.classList.add('bg-red-600', 'animate-pulse');
          setupAudioVisualization();
          console.log("Listening...");
      };
      
      recognition.onend = function() {
          isListening = false;
          // Note: isVoiceInput is reset in actionButton.click() after AI response is received
          micButton.classList.remove('bg-red-600', 'animate-pulse');
          micButton.classList.add('bg-gray-700');
          stopAudioVisualization();
          console.log("Listening ended.");
      };

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        console.log("Voice Input:", transcript);
        chatInput.value = transcript;
        updateActionButton();
        // Automatically submit the recognized text
        actionButton.click();
      };

      recognition.onerror = function (event) {
        console.error("Speech recognition error:", event.error); 
        isListening = false; 
        isVoiceInput = false; // Reset flag on error
        micButton.classList.remove('bg-red-600', 'animate-pulse');
        micButton.classList.add('bg-gray-700');
        stopAudioVisualization();
      };
    } else {
      console.log("Web Speech API not supported in this browser.");
      micButton.disabled = true;
    }

    micButton.addEventListener("click", () => {
      if (recognition && !isListening && !chatInput.disabled) {
        try {
            recognition.start();
        } catch (e) {
            console.error("Error starting recognition:", e);
        }
      } else if (isListening) {
          recognition.stop();
          console.log("Recognition stopped by user.");
      } else if (chatInput.disabled) {
          console.log("Cannot start mic while AI is processing.");
      }
    });
  </script>

</body>

</html>
